[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cipa"
version = "2.0.0rc1"
description = "CIPA: A Multi-Domain Statistical Framework for Characterizing Imbalanced Datasets and Computing a Difficulty Score"
authors = [
    { name = "Luis García Rodríguez", email = "luis.garcia@unam.edu" },
    { name = "José Antonio Neme Castillo", email = "antonio.neme@iimas.unam.mx" },
    { name = "Helena Montserrat Gómez Adorno", email = "helena.gomez@iimas.unam.mx" },
    { name = "Gibrán Fuentes Pineda", email = "gibranfp@unam.mx" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = [
    "imbalanced learning",
    "data complexity",
    "classification difficulty",
    "machine learning",
    "meta-learning",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/luisgarciarodriguez-research/cipa"
Repository = "https://github.com/luisgarciarodriguez-research/cipa"
"Bug Tracker" = "https://github.com/luisgarciarodriguez-research/cipa/issues"

[project.optional-dependencies]
experiments = [
    "pandas>=2.0",
]
dev = [
    "pandas>=2.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------------------
# Ruff — linting and formatting
# ---------------------------------------------------------------------------
[tool.ruff]
src = ["src"]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",   # line too long — handled by formatter
    "N803",   # argument name should be lowercase (math vars like X, N, IR are OK)
    "N806",   # variable in function should be lowercase (same)
    "RUF001", # ambiguous unicode — σ, −, ×, ≤ follow the paper's notation on purpose
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N801", "N802", "N803", "N806"]  # test names may use math and task IDs (TestT0701_...)
"src/cipa/dataset.py" = ["N802"]       # X, N, IR, X_minority, X_majority are mathematical API names from the paper

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=cipa",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
    "-v",
]

[tool.coverage.run]
source = ["src/cipa"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
